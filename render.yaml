# Render Blueprint — من لوحة Render: New ← Blueprint ← اختر المستودع.
# الإعداد الحالي: الخطة المجانية للتجربة (بلا دفع).
#   - الخدمة تنام بعد 15 دقيقة بلا زيارات (أول فتح بعدها ~دقيقة). شاشة التابلت ولوحة الموظف المفتوحتان تبقيانها مستيقظة.
#   - القاعدة المجانية تنتهي بعد 30 يومًا وبلا نسخ احتياطي.
# للتشغيل الفعلي: غيّر plan إلى starter للخدمة و basic-256mb للقاعدة (أو من لوحة Render ← Upgrade) — البيانات تبقى.
services:
  - type: web
    name: nidaa
    runtime: node
    plan: free               # للتشغيل الفعلي: starter (دائم التشغيل)
    region: frankfurt        # الأقرب للخليج بين مناطق Render
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nidaa-db
          property: connectionString
      - key: SETUP_TOKEN        # رمز الإعداد الأول — انسخه من صفحة Environment
        generateValue: true
      - key: RETENTION_DAYS
        value: "90"
      # الرابط العام يؤخذ تلقائيًا من RENDER_EXTERNAL_URL (https://….onrender.com).
      # عند ربط نطاق خاص أضف متغير PUBLIC_URL=https://نطاقك من صفحة Environment.
databases:
  - name: nidaa-db
    plan: free               # للتشغيل الفعلي: basic-256mb (نسخ احتياطي + بلا انتهاء)
    region: frankfurt
    postgresMajorVersion: "16"
