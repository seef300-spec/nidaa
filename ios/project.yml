# مشروع XcodeGen — على جهاز ماك: brew install xcodegen && xcodegen generate
# غيّر BUNDLE_PREFIX و DEVELOPMENT_TEAM و NIDAA_DOMAIN قبل التوليد.
name: Nidaa
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
settings:
  base:
    DEVELOPMENT_TEAM: "XXXXXXXXXX"
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    NIDAA_DOMAIN: "nidaa.example.com"
    BUNDLE_PREFIX: "com.example.nidaa"
targets:
  Nidaa:
    type: application
    platform: iOS
    sources: [NidaaApp, Shared]
    dependencies:
      - target: NidaaClip
        embed: true
        codeSign: true
        copy:
          destination: custom
          subpath: "$(CONTENTS_FOLDER_PATH)/AppClips"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_PREFIX)"
        INFOPLIST_FILE: NidaaApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: NidaaApp/Nidaa.entitlements
  NidaaClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources: [NidaaClip, Shared]
    dependencies:
      - target: NidaaLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_PREFIX).Clip"
        INFOPLIST_FILE: NidaaClip/Info.plist
        CODE_SIGN_ENTITLEMENTS: NidaaClip/NidaaClip.entitlements
  NidaaLiveActivity:
    type: app-extension
    platform: iOS
    sources: [NidaaLiveActivity, Shared/NidaaOrderAttributes.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_PREFIX).Clip.LiveActivity"
        INFOPLIST_FILE: NidaaLiveActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: NidaaLiveActivity/NidaaLiveActivity.entitlements
