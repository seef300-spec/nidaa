<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>دخول الموظفين — نداء</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/pages.css">
<script type="module" src="/js/login.js"></script>
</head>
<body class="auth-page">
<main class="center-page">
  <form class="card card-pad auth-card stack" id="form" novalidate>
    <div class="auth-brand"><img src="/icons/favicon.svg" alt="" width="56" height="56"><h1>نداء</h1></div>
    <p class="muted">دخول الموظفين والمالك</p>
    <div class="alert alert-error" id="err" role="alert" hidden></div>
    <label class="field"><span>اسم المستخدم</span><input class="input input-ltr" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="field"><span>كلمة المرور</span><input class="input input-ltr" id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary btn-lg btn-block" id="submit" type="submit">دخول</button>
    <p class="small muted" id="setupHint" hidden>لم يُعدّ النظام بعد. <a href="/setup">ابدأ الإعداد الأول</a></p>
  </form>
</main>
</body>
</html>
